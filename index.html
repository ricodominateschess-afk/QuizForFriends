<!DOCTYPE html>
<html>

<head>

    <title>Ocean Quiz</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="ocean">

    <!-- BUBBLES -->

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>


    <!-- FISH -->

    <div class="fish fish1">🐠</div>
    <div class="fish fish2">🐟</div>
    <div class="fish fish3">🐡</div>


    <!-- MAIN CONTAINER -->

    <main class="container">


        <!-- HOME SCREEN -->

        <section id="home" class="screen active">

            <div class="logo">
                🌊
            </div>

            <h1>
                Ocean Quiz
            </h1>

            <p class="subtitle">

                Test your knowledge.<br>
                Challenge your friends.

            </p>


            <!-- TAKE QUIZ -->

            <button
                class="main-btn"
                onclick="showNameScreen()">

                TAKE A QUIZ

            </button>


            <!-- CREATE QUIZ -->

            <button
                class="secondary-btn"
                onclick="showCreateScreen()">

                CREATE A QUIZ

            </button>


            <!-- LEADERBOARD -->

            <button
                class="link-btn"
                onclick="showLeaderboard()">

                🏆 LEADERBOARD

            </button>

        </section>



        <!-- NAME SCREEN -->

        <section
            id="nameScreen"
            class="screen">

            <div class="icon">
                👤
            </div>

            <h2>
                What's your name?
            </h2>

            <p>
                Enter your name before starting.
            </p>

            <input
                type="text"
                id="playerName"
                placeholder="Your name..."
                maxlength="20"
            >


            <button
                class="main-btn"
                onclick="startQuiz()">

                START 🌊

            </button>


            <button
                class="back-btn"
                onclick="goHome()">

                ← Back

            </button>

        </section>



        <!-- QUIZ SCREEN -->

        <section
            id="quizScreen"
            class="screen">


            <div class="quiz-top">

                <span id="questionNumber">

                    Question 1/19

                </span>


                <span id="scoreText">

                    Score: 0

                </span>

            </div>


            <!-- PROGRESS BAR -->

            <div class="progress">

                <div id="progressBar"></div>

            </div>


            <!-- QUESTION CARD -->

            <div class="card">


                <h2 id="question">

                    Question

                </h2>


                <!-- ANSWERS -->

                <div id="answers"></div>


                <!-- NEXT -->

                <button
                    id="nextButton"
                    class="next-btn"
                    onclick="nextQuestion()"
                    disabled>

                    NEXT →

                </button>

            </div>

        </section>



        <!-- RESULT SCREEN -->

        <section
            id="resultScreen"
            class="screen">


            <div
                id="resultEmoji"
                class="result-emoji">

                🏆

            </div>


            <h1 id="resultTitle">

                Rico Expert

            </h1>


            <div class="score">

                <span id="finalScore">

                    0

                </span>

                <small>
                    /19
                </small>

            </div>


            <!-- ANALYSIS -->

            <div class="analysis">

                <h3>
                    📊 Your Analysis
                </h3>


                <p id="percentage">

                </p>


                <p id="resultMessage">

                </p>

            </div>


            <!-- LEADERBOARD -->

            <button
                class="main-btn"
                onclick="showLeaderboard()">

                🏆 VIEW LEADERBOARD

            </button>


            <!-- HOME -->

            <button
                class="secondary-btn"
                onclick="goHome()">

                HOME

            </button>

        </section>



        <!-- LEADERBOARD SCREEN -->

        <section
            id="leaderboardScreen"
            class="screen">


            <div class="icon">

                🏆

            </div>


            <h1>

                Leaderboard

            </h1>


            <p>

                See who's on top.

            </p>


            <div id="leaderboardList">

            </div>


            <button
                class="back-btn"
                onclick="goHome()">

                ← Back

            </button>

        </section>



        <!-- CREATE QUIZ SCREEN -->

        <section
            id="createScreen"
            class="screen">


            <div class="icon">

                ✏️

            </div>


            <h1>

                Create a Quiz

            </h1>


            <!-- QUIZ TITLE -->

            <input
                type="text"
                id="quizTitle"
                placeholder="Quiz title..."
                maxlength="40"
            >


            <!-- QUESTIONS -->

            <div id="questionBuilder">


                <div class="builder-card">


                    <input
                        type="text"
                        class="new-question"
                        placeholder="Question..."
                    >


                    <input
                        type="text"
                        class="new-answer"
                        placeholder="Answer A"
                    >


                    <input
                        type="text"
                        class="new-answer"
                        placeholder="Answer B"
                    >


                    <input
                        type="text"
                        class="new-answer"
                        placeholder="Answer C"
                    >


                    <input
                        type="text"
                        class="new-answer"
                        placeholder="Answer D"
                    >


                    <select
                        class="correct-answer">


                        <option value="0">

                            Correct: A

                        </option>


                        <option value="1">

                            Correct: B

                        </option>


                        <option value="2">

                            Correct: C

                        </option>


                        <option value="3">

                            Correct: D

                        </option>


                    </select>

                </div>

            </div>


            <!-- ADD QUESTION -->

            <button
                class="secondary-btn"
                onclick="addQuestion()">

                + ADD QUESTION

            </button>


            <!-- CREATE -->

            <button
                class="main-btn"
                onclick="createQuiz()">

                CREATE QUIZ

            </button>


            <!-- BACK -->

            <button
                class="back-btn"
                onclick="goHome()">

                ← Back

            </button>

        </section>


    </main>



    <!-- OCEAN FLOOR -->

    <div class="floor">

        🪸 🐚 🪸 🐚 🪸

    </div>


</div>


<!-- JAVASCRIPT -->

<script type="module" src="script.js"></script>

</body>

</html>
